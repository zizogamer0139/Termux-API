<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Termux</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #212121;
            color: #ffffff;
            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            height: 100%;
            background: #171717;
            border-right: 1px solid #303030;

            display: flex;
            flex-direction: column;

            padding: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 12px;
            margin-bottom: 10px;

            font-size: 18px;
            font-weight: 700;
        }

        .brand-icon {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            background: #ffffff;
            color: #171717;

            font-weight: 800;
        }

        .new-chat {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #3a3a3a;
            border-radius: 10px;

            background: #212121;
            color: #ffffff;

            cursor: pointer;

            text-align: left;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .new-chat:hover {
            background: #2a2a2a;
            border-color: #4a4a4a;
        }

        .history {
            flex: 1;
            overflow-y: auto;

            margin-top: 18px;
        }

        .history-title {
            padding: 8px 10px;

            color: #8e8e8e;

            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .history-item {
            width: 100%;

            padding: 10px;

            border: 0;
            border-radius: 8px;

            background: transparent;
            color: #d0d0d0;

            cursor: pointer;

            text-align: left;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #252525;
        }

        .sidebar-footer {
            padding: 10px;

            color: #777777;

            font-size: 12px;
        }

        /* MAIN */

        .main {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;

            background: #212121;
        }

        .topbar {
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            border-bottom: 1px solid #303030;
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #8e8e8e;

            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #4ade80;
        }

        /* CHAT */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 30px 20px 150px;
        }

        .chat-inner {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;
        }

        .welcome {
            min-height: 55vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        .welcome-logo {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            border-radius: 16px;

            background: #ffffff;
            color: #171717;

            font-size: 25px;
            font-weight: 800;
        }

        .welcome h1 {
            margin: 0 0 10px;

            font-size: 30px;
            font-weight: 700;
        }

        .welcome p {
            max-width: 520px;

            margin: 0;

            color: #999999;

            line-height: 1.6;
        }

        .message {
            display: flex;
            gap: 14px;

            padding: 22px 8px;
        }

        .message + .message {
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .avatar {
            flex: 0 0 auto;

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: #ffffff;
            color: #171717;

            font-size: 13px;
            font-weight: 800;
        }

        .message.user .avatar {
            background: #444444;
            color: #ffffff;
        }

        .message-content {
            min-width: 0;
            flex: 1;

            padding-top: 4px;

            color: #eeeeee;

            line-height: 1.65;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message-label {
            margin-bottom: 5px;

            color: #aaaaaa;

            font-size: 12px;
            font-weight: 600;
        }

        .thinking {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            color: #999999;
        }

        .thinking span {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #999999;

            animation: thinking 1.2s infinite ease-in-out;
        }

        .thinking span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .thinking span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes thinking {
            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* COMPOSER */

        .composer-area {
            position: fixed;

            left: 260px;
            right: 0;
            bottom: 0;

            padding: 20px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(33, 33, 33, 0),
                    #212121 28%
                );
        }

        .composer-inner {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 10px;

            padding: 10px 10px 10px 16px;

            border: 1px solid #4a4a4a;
            border-radius: 16px;

            background: #2f2f2f;

            box-shadow:
                0 4px 30px rgba(0, 0, 0, 0.25);
        }

        .composer textarea {
            flex: 1;

            min-height: 28px;
            max-height: 180px;

            resize: none;

            border: 0;
            outline: 0;

            background: transparent;
            color: #ffffff;

            line-height: 1.5;
        }

        .composer textarea::placeholder {
            color: #888888;
        }

        .send {
            width: 36px;
            height: 36px;

            flex: 0 0 auto;

            border: 0;
            border-radius: 10px;

            background: #ffffff;
            color: #171717;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: 800;

            transition:
                transform 0.12s ease,
                opacity 0.12s ease;
        }

        .send:hover {
            transform: scale(1.04);
        }

        .send:disabled {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }

        .disclaimer {
            padding-top: 8px;

            text-align: center;

            color: #777777;

            font-size: 11px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 15px;
            }

            .chat {
                padding-left: 12px;
                padding-right: 12px;
            }

            .message {
                gap: 10px;
            }

            .composer-area {
                left: 0;
                padding: 12px;
            }

            .welcome h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">T</div>
            <span>Termux</span>
        </div>

        <button
            class="new-chat"
            id="newChatButton"
        >
            + New chat
        </button>

        <div class="history">

            <div class="history-title">
                Chats
            </div>

            <div id="historyList"></div>

        </div>

        <div class="sidebar-footer">
            Termux AI
        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="topbar-title">
                Termux
            </div>

            <div class="status">
                <div class="status-dot"></div>
                Online
            </div>

        </header>

        <section
            class="chat"
            id="chat"
        >

            <div class="chat-inner">

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        T
                    </div>

                    <h1>
                        How can I help?
                    </h1>

                    <p>
                        Ask Termux anything. Your messages
                        are processed by the Termux AI API.
                    </p>

                </div>

            </div>

        </section>

        <div class="composer-area">

            <div class="composer-inner">

                <form
                    class="composer"
                    id="composer"
                >

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message Termux..."
                        autocomplete="off"
                    ></textarea>

                    <button
                        class="send"
                        id="sendButton"
                        type="submit"
                        aria-label="Send"
                    >
                        ↑
                    </button>

                </form>

                <div class="disclaimer">
                    Termux AI can make mistakes. Check important information.
                </div>

            </div>

        </div>

    </main>

</div>

<script>

    const API_URL =
        "https://termux-api-server.onrender.com/ask";


    const composer =
        document.getElementById("composer");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const chat =
        document.getElementById("chat");

    const chatInner =
        chat.querySelector(".chat-inner");

    const welcome =
        document.getElementById("welcome");

    const newChatButton =
        document.getElementById("newChatButton");

    const historyList =
        document.getElementById("historyList");


    let messages = [];

    let isSending = false;


    function saveChat() {

        localStorage.setItem(
            "termux_chat",
            JSON.stringify(messages)
        );

    }


    function loadChat() {

        try {

            const saved =
                localStorage.getItem(
                    "termux_chat"
                );

            if (!saved) {
                return;
            }

            messages =
                JSON.parse(saved);

            if (!Array.isArray(messages)) {
                messages = [];
                return;
            }

            for (const message of messages) {

                addMessageToUI(
                    message.role,
                    message.content
                );

            }

            if (messages.length > 0) {
                welcome.style.display = "none";
            }

        } catch (error) {

            console.error(
                "Could not load chat:",
                error
            );

            messages = [];

        }

    }


    function addMessageToUI(
        role,
        content
    ) {

        welcome.style.display = "none";


        const message =
            document.createElement("div");

        message.className =
            `message ${role}`;


        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";

        avatar.textContent =
            role === "user"
                ? "Y"
                : "T";


        const body =
            document.createElement("div");

        body.className =
            "message-content";


        const label =
            document.createElement("div");

        label.className =
            "message-label";

        label.textContent =
            role === "user"
                ? "You"
                : "Termux";


        const text =
            document.createElement("div");

        text.textContent =
            content;


        body.appendChild(label);
        body.appendChild(text);

        message.appendChild(avatar);
        message.appendChild(body);

        chatInner.appendChild(message);


        scrollToBottom();

    }


    function addThinkingMessage() {

        const message =
            document.createElement("div");

        message.className =
            "message assistant";

        message.id =
            "thinkingMessage";


        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";

        avatar.textContent =
            "T";


        const body =
            document.createElement("div");

        body.className =
            "message-content";


        const label =
            document.createElement("div");

        label.className =
            "message-label";

        label.textContent =
            "Termux";


        const thinking =
            document.createElement("div");

        thinking.className =
            "thinking";

        thinking.innerHTML =
            `
                <span></span>
                <span></span>
                <span></span>
            `;


        body.appendChild(label);
        body.appendChild(thinking);

        message.appendChild(avatar);
        message.appendChild(body);

        chatInner.appendChild(message);

        scrollToBottom();

    }


    function removeThinkingMessage() {

        const thinking =
            document.getElementById(
                "thinkingMessage"
            );

        if (thinking) {
            thinking.remove();
        }

    }


    function scrollToBottom() {

        requestAnimationFrame(() => {

            chat.scrollTo({
                top: chat.scrollHeight,
                behavior: "smooth"
            });

        });

    }


    function addHistoryItem(
        text
    ) {

        const item =
            document.createElement("button");

        item.className =
            "history-item";

        item.textContent =
            text;


        item.onclick = () => {

            messageInput.value =
                text;

            messageInput.focus();

        };


        historyList.prepend(
            item
        );


        while (
            historyList.children.length > 8
        ) {

            historyList.lastChild.remove();

        }

    }


    async function sendMessage(
        message
    ) {

        if (
            isSending ||
            !message.trim()
        ) {
            return;
        }


        message =
            message.trim();


        isSending = true;

        sendButton.disabled = true;


        messages.push({
            role: "user",
            content: message
        });

        addMessageToUI(
            "user",
            message
        );

        addHistoryItem(
            message
        );

        saveChat();


        messageInput.value = "";

        resizeTextarea();


        addThinkingMessage();


        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `API returned ${response.status}`
                );

            }


            const data =
                await response.json();


            const answer =
                data.response;


            if (
                typeof answer !== "string" ||
                !answer.trim()
            ) {

                throw new Error(
                    "API returned an empty response"
                );

            }


            removeThinkingMessage();


            messages.push({
                role: "assistant",
                content: answer
            });

            addMessageToUI(
                "assistant",
                answer
            );

            saveChat();


        } catch (error) {

            console.error(
                "Termux API error:",
                error
            );


            removeThinkingMessage();


            const errorMessage =
                "I couldn't connect to the Termux AI API right now.";


            messages.push({
                role: "assistant",
                content: errorMessage
            });

            addMessageToUI(
                "assistant",
                errorMessage
            );

            saveChat();

        } finally {

            isSending = false;

            sendButton.disabled = false;

            messageInput.focus();

        }

    }


    function resizeTextarea() {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                180
            ) + "px";

    }


    composer.addEventListener(
        "submit",
        event => {

            event.preventDefault();

            sendMessage(
                messageInput.value
            );

        }
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                composer.requestSubmit();

            }

        }
    );


    messageInput.addEventListener(
        "input",
        resizeTextarea
    );


    newChatButton.addEventListener(
        "click",
        () => {

            messages = [];

            localStorage.removeItem(
                "termux_chat"
            );

            chatInner
                .querySelectorAll(
                    ".message"
                )
                .forEach(
                    element => element.remove()
                );

            welcome.style.display =
                "flex";

            historyList.innerHTML =
                "";

            messageInput.value =
                "";

            resizeTextarea();

            messageInput.focus();

        }
    );


    loadChat();

    messageInput.focus();

</script>

</body>
</html>
